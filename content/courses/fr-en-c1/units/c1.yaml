id: c1
title: Le subjonctif
subtitle: Une forme rare, mais qui trahit le niveau
icon: clock
color: sky
level: C1

lessons:
  - id: c1-l1
    title: Le subjonctif présent
    notes: |
      L'anglais a gardé un subjonctif, et il est d'une simplicité désarmante :
      **la base verbale nue**, sans -s et sans accord, à toutes les personnes.

      Il apparaît après les verbes et adjectifs d'exigence, de recommandation
      et de nécessité.

      — insist, demand, require, recommend, suggest, ask.
        I insist that he be present. (et non « that he is »)
      — `it is essential / vital / crucial that…`
        It is essential that the document remain confidential.

      ! La troisième personne perd son -s : `that she apply`, jamais « applies ».

      L'anglais britannique contourne souvent le subjonctif avec `should` :
      I insist that he should be present.
    verbs:
      - verb: to be
        translation: être
        tense: subjonctif présent
        note: "Une seule forme pour toutes les personnes : « be »."
        forms:
          - id: c1-be-subj
            person: subjonctif (toutes personnes)
            answer: be
          - id: c1-be-subj-neg
            person: subjonctif négatif
            answer: not be
      - verb: to apply
        translation: postuler
        tense: subjonctif présent
        note: Pas de -s à la troisième personne, contrairement au présent simple.
        forms:
          - id: c1-apply-subj
            person: subjonctif, il / elle
            answer: apply
          - id: c1-apply-pres
            person: présent simple, il / elle
            answer: applies
      - verb: to remain
        translation: rester
        tense: subjonctif présent
        note: Fréquent dans les formules juridiques et administratives.
        forms:
          - id: c1-remain-subj
            person: subjonctif, il / elle
            answer: remain
          - id: c1-remain-pres
            person: présent simple, il / elle
            answer: remains
      - verb: to have
        translation: avoir
        tense: subjonctif présent
        note: "« that he have » : forme rare mais correcte après insist, demand."
        forms:
          - id: c1-have-subj
            person: subjonctif, il / elle
            answer: have
          - id: c1-have-pres
            person: présent simple, il / elle
            answer: has

  - id: c1-l2
    title: Le subjonctif passé et les formes irréelles
    notes: |
      Un seul mécanisme couvre tout l'irréel : **le prétérit y marque la distance
      au réel, pas le passé**.

      — `were` à toutes les personnes après `if`, `as if`, `wish`.
        If I were you… / He talks as if he were an expert.
      — `would rather` + sujet + prétérit.
        I would rather you came tomorrow. Je préférerais que tu viennes demain.
      — `it is time` + prétérit.
        It is time we left. Il est temps que nous partions.

      ! Aucun de ces prétérits ne renvoie au passé : `It is time we left` parle
      bien du moment présent.
    verbs:
      - verb: to be
        translation: être
        tense: were-subjunctive
        note: "« Were » à toutes les personnes, y compris « I » et « he »."
        forms:
          - id: c1-be-were-1
            person: irréel, je / il / elle
            answer: were
          - id: c1-be-past-1
            person: prétérit ordinaire, je / il / elle
            answer: was
      - verb: to come
        translation: venir
        tense: après « would rather »
        note: "« Would rather » + sujet + prétérit quand on parle d'autrui."
        forms:
          - id: c1-come-rather
            person: après « I would rather you »
            answer: came
          - id: c1-come-inf
            person: après « I would rather » (même sujet)
            answer: come
      - verb: to leave
        translation: partir
        tense: après « it is time »
        note: "« It is time we left » : prétérit malgré le sens présent."
        forms:
          - id: c1-leave-time
            person: après « it is time we »
            answer: left
          - id: c1-leave-inf
            person: après « it is time to »
            answer: leave
      - verb: to know
        translation: savoir
        tense: après « as if »
        note: "« As if he knew » signale que ce n'est pas le cas."
        forms:
          - id: c1-know-asif
            person: irréel après « as if »
            answer: knew
          - id: c1-know-asif-past
            person: irréel antérieur après « as if »
            answer: had known
