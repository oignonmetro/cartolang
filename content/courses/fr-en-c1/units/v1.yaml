id: v1
title: Registre soutenu
subtitle: Les mots qui n'appartiennent qu'à l'écrit formel
icon: book
color: teal
level: C1

lessons:
  - id: v1-l1
    title: Mots-outils du registre écrit
    vocab:
      - id: c1-hitherto
        term: hitherto
        translation: jusqu'à présent
        alt:
          - jusqu'ici
        pos: adverbe
        hint: Registre écrit et formel ; à l'oral on dirait « until now ».
        example:
          text: The document was hitherto unknown to historians.
          translation: Le document était jusqu'à présent inconnu des historiens.
      - id: c1-notwithstanding
        term: notwithstanding
        translation: nonobstant
        alt:
          - malgré
        pos: préposition
        hint: "Peut aussi suivre le groupe qu'il régit : « these objections notwithstanding »."
        example:
          text: Notwithstanding these reservations, the plan went ahead.
          translation: Malgré ces réserves, le plan a été mis en œuvre.
      - id: c1-insofar-as
        term: insofar as
        translation: dans la mesure où
        alt:
          - pour autant que
          - en tant que
        pos: expression
        example:
          text: The rule applies insofar as the contract is valid.
          translation: La règle s'applique dans la mesure où le contrat est valable.
      - id: c1-to-deem
        term: to deem
        translation: juger
        alt:
          - estimer
        pos: verbe
        gap: deemed
        example:
          text: The evidence was deemed insufficient.
          translation: Les preuves ont été jugées insuffisantes.
      - id: c1-whereby
        term: whereby
        translation: par lequel
        alt:
          - au moyen duquel
        pos: pronom
        hint: Relie un dispositif à son mécanisme ; très fréquent dans les textes juridiques.
        example:
          text: They signed an agreement whereby costs are shared.
          translation: Ils ont signé un accord par lequel les coûts sont partagés.
      - id: c1-thereby
        term: thereby
        translation: ce faisant
        alt:
          - par là même
        pos: adverbe
        example:
          text: The law was repealed, thereby ending the dispute.
          translation: La loi a été abrogée, mettant ce faisant fin au litige.
      - id: c1-to-forgo
        term: to forgo
        translation: renoncer à
        alt:
          - se passer de
        pos: verbe
        gap: forgo
        example:
          text: They agreed to forgo their bonuses.
          translation: Ils ont accepté de renoncer à leurs primes.
      - id: c1-scant
        term: scant
        translation: maigre
        alt:
          - fort peu de
        pos: adjectif
        example:
          text: There is scant evidence for that claim.
          translation: Il existe fort peu de preuves à l'appui de cette affirmation.

  - id: v1-l2
    title: Renvois et liens de l'écrit formel
    vocab:
      - id: c1-henceforth
        term: henceforth
        translation: désormais
        alt:
          - dorénavant
        pos: adverbe
        hint: Tourné vers l'avenir, quand « hitherto » regarde en arrière.
        example:
          text: The clause shall henceforth apply to all subsidiaries.
          translation: La clause s'applique désormais à toutes les filiales.
      - id: c1-thereafter
        term: thereafter
        translation: par la suite
        alt:
          - ensuite
        pos: adverbe
        example:
          text: The committee met once and never thereafter.
          translation: La commission s'est réunie une fois et jamais par la suite.
      - id: c1-therein
        term: therein
        translation: dans ce document
        alt:
          - là-dedans
        pos: adverbe
        hint: "Renvoie à ce qui précède : le texte, le lieu, la chose déjà nommée."
        example:
          text: The report and the figures contained therein are confidential.
          translation: Le rapport et les chiffres qu'il contient sont confidentiels.
      - id: c1-hereby
        term: hereby
        translation: par la présente
        pos: adverbe
        hint: Propre aux actes qui s'accomplissent en s'énonçant, comme une résiliation.
        example:
          text: We hereby terminate the agreement.
          translation: Nous résilions par la présente le contrat.
      - id: c1-pursuant-to
        term: pursuant to
        translation: conformément à
        alt:
          - en application de
        pos: préposition
        example:
          text: The data was destroyed pursuant to the court order.
          translation: Les données ont été détruites conformément à la décision de justice.
      - id: c1-whereupon
        term: whereupon
        translation: sur quoi
        alt:
          - après quoi
        pos: adverbe
        hint: Enchaîne deux faits dans un récit écrit, sans nouvelle phrase.
        example:
          text: The chair called a vote, whereupon three members walked out.
          translation: Le président a demandé un vote, sur quoi trois membres sont sortis.
      - id: c1-in-lieu-of
        term: in lieu of
        translation: à la place de
        alt:
          - au lieu de
        pos: préposition
        hint: "Faux ami trompeur : « lieu » est bien le mot français, mais figé dans cette locution seule."
        example:
          text: Staff were offered days off in lieu of overtime pay.
          translation: Le personnel s'est vu proposer des jours de congé à la place des heures supplémentaires.
      - id: c1-barring
        term: barring
        translation: sauf
        alt:
          - hormis
          - sauf imprévu
        pos: préposition
        example:
          text: Barring further delays, the bridge opens in June.
          translation: Sauf nouveaux retards, le pont ouvre en juin.

  - id: v1-l3
    title: Le lexique du registre soutenu
    vocab:
      - id: c1-to-ascertain
        term: to ascertain
        translation: établir avec certitude
        alt:
          - vérifier
        pos: verbe
        gap: ascertain
        hint: Plus fort que « to check » (on établit un fait, on ne le contrôle pas).
        example:
          text: Investigators could not ascertain the cause of the fire.
          translation: Les enquêteurs n'ont pu établir avec certitude la cause de l'incendie.
      - id: c1-to-endeavour
        term: to endeavour
        translation: s'employer à
        alt:
          - entreprendre
        pos: verbe
        gap: endeavour
        example:
          text: We endeavour to answer every request within a week.
          translation: Nous nous employons à répondre à chaque demande sous une semaine.
      - id: c1-to-cease
        term: to cease
        translation: cesser
        pos: verbe
        gap: ceased
        hint: "« Stop » à l'oral, « cease » à l'écrit administratif."
        example:
          text: The company ceased trading in March.
          translation: L'entreprise a cessé son activité en mars.
      - id: c1-to-obviate
        term: to obviate
        translation: rendre superflu
        alt:
          - dispenser de
        pos: verbe
        gap: obviates
        hint: On n'écarte pas le problème, on le rend sans objet.
        example:
          text: The new process obviates the need for a second check.
          translation: Le nouveau procédé rend superflu un second contrôle.
      - id: c1-to-expedite
        term: to expedite
        translation: accélérer
        alt:
          - hâter
        pos: verbe
        gap: expedite
        example:
          text: A dedicated team was set up to expedite the claims.
          translation: Une équipe dédiée a été créée pour accélérer le traitement des demandes.
      - id: c1-aforementioned
        term: aforementioned
        translation: susmentionné
        alt:
          - précité
        pos: adjectif
        example:
          text: The aforementioned clause was never invoked.
          translation: La clause susmentionnée n'a jamais été invoquée.
      - id: c1-paucity
        term: paucity
        translation: pénurie
        alt:
          - rareté
          - indigence
        pos: nom
        hint: "S'emploie surtout de l'immatériel : une pénurie de données, de preuves."
        example:
          text: The paucity of reliable data hampered the study.
          translation: La pénurie de données fiables a entravé l'étude.
      - id: c1-extant
        term: extant
        translation: subsistant
        alt:
          - encore existant
        pos: adjectif
        hint: Se dit de ce qui a survécu au temps (manuscrits, espèces, bâtiments).
        example:
          text: Only three extant copies of the manuscript are known.
          translation: On ne connaît que trois exemplaires subsistants du manuscrit.

  - id: v1-l4
    title: Verbes du registre formel
    vocab:
      - id: c1-to-eschew
        term: to eschew
        translation: s'abstenir de
        alt:
          - se garder de
          - fuir
        pos: verbe
        gap: eschews
        hint: On renonce par principe, non par contrainte, la nuance est morale.
        example:
          text: The author eschews jargon of any kind.
          translation: L'auteur s'abstient de tout jargon.
      - id: c1-to-construe
        term: to construe
        translation: interpréter
        alt:
          - comprendre
        pos: verbe
        gap: construed
        hint: "Terme du droit et de l'exégèse : on interprète un texte, une clause."
        example:
          text: The clause was construed narrowly by the court.
          translation: La clause a été interprétée de façon restrictive par le tribunal.
      - id: c1-to-entail
        term: to entail
        translation: impliquer
        alt:
          - supposer
          - entraîner
        pos: verbe
        gap: entails
        hint: L'implication est logique et nécessaire, pas une simple conséquence.
        example:
          text: The post entails a good deal of travel.
          translation: Le poste implique de nombreux déplacements.
      - id: c1-to-purport
        term: to purport
        translation: prétendre
        alt:
          - se donner pour
        pos: verbe
        gap: purports
        hint: Signale que l'auteur ne reprend pas l'affirmation à son compte.
        example:
          text: The document purports to be a royal charter.
          translation: Le document prétend être une charte royale.
      - id: c1-forthwith
        term: forthwith
        translation: sans délai
        alt:
          - sur-le-champ
        pos: adverbe
        example:
          text: All payments were suspended forthwith.
          translation: Tous les paiements ont été suspendus sans délai.
      - id: c1-inter-alia
        term: inter alia
        translation: entre autres
        pos: expression
        hint: Latinisme de l'écrit juridique, resté tel quel en anglais.
        example:
          text: The report cites, inter alia, three earlier studies.
          translation: Le rapport cite, entre autres, trois études antérieures.
      - id: c1-to-elapse
        term: to elapse
        translation: s'écouler
        pos: verbe
        gap: elapsed
        hint: Ne se dit que du temps, et jamais d'un liquide.
        example:
          text: Six months elapsed before anyone replied.
          translation: Six mois se sont écoulés avant que quiconque réponde.
      - id: c1-to-abate
        term: to abate
        translation: s'atténuer
        alt:
          - faiblir
          - se calmer
        pos: verbe
        gap: abating
        example:
          text: The storm showed no sign of abating.
          translation: La tempête ne montrait aucun signe d'atténuation.
