id: g3
title: Atténuation et prudence
subtitle: Dire moins pour dire mieux
icon: people
color: violet
level: C1

lessons:
  - id: g3-l1
    title: Les marqueurs de prudence
    notes: |
      L'anglais académique et journalistique **affirme rarement sans filet**. Un
      C1 se reconnaît moins à son vocabulaire qu'à sa façon de doser ses
      affirmations.

      - Modaux affaiblis : may, might, could + base verbale.
      - Verbes de tendance : tend to, appear to, seem to.
        Prices tend to rise in the autumn. (une tendance, pas une loi)
      - Adverbes : arguably, seemingly, largely, broadly.
      - Tournures impersonnelles : it would appear that, it is widely held that.

      ! Trop d'atténuation affaiblit le propos : l'enjeu est le dosage, pas
      l'accumulation.
    points:
      - id: g3-hedge-1
        sentence: The figures ___ to suggest a slowdown.
        answer: appear
        alt:
          - seem
        options:
          - appear
          - appears
          - appearing
          - are appearing
        translation: Les chiffres semblent indiquer un ralentissement.
        explanation: « Figures » est pluriel ; « appear to » atténue une affirmation.
      - id: g3-hedge-2
        sentence: Prices ___ to rise sharply in the autumn.
        answer: tend
        options:
          - tend
          - tends
          - are tending
          - tended
        translation: Les prix ont tendance à fortement augmenter à l'automne.
        explanation: « Tend to » transforme une règle absolue en tendance.
      - id: g3-hedge-3
        sentence: It ___ appear that the two events are unrelated.
        answer: would
        options:
          - would
          - will
          - should
          - could
        translation: Il semblerait que les deux événements soient sans lien.
        explanation: "Tournure impersonnelle prudente : « It would appear that… »."
      - id: g3-hedge-4
        sentence: The policy has been ___ successful, though not entirely.
        answer: largely
        alt:
          - broadly
        options:
          - largely
          - totally
          - hardly
          - barely
        translation: La politique a été largement efficace, sans l'être totalement.
        explanation: La suite de la phrase impose un adverbe de degré partiel.
      - id: g3-hedge-5
        sentence: Such a reading is ___ defensible, but it is not the only one.
        answer: arguably
        options:
          - arguably
          - undeniably
          - certainly
          - unquestionably
        translation: Une telle lecture est sans doute défendable, mais ce n'est pas la seule.
        explanation: « Arguably » ouvre la discussion ; les autres options la ferment.
      - id: g3-hedge-6
        sentence: The results are valid ___ some extent.
        answer: to
        options:
          - to
          - at
          - in
          - by
        translation: Les résultats sont valables dans une certaine mesure.
        explanation: "Collocation figée : « to some extent »."

  - id: g3-l2
    title: Distance, rumeur et responsabilité
    notes: |
      Pour rapporter **sans endosser**, l'anglais dispose d'une série d'adverbes
      de phrase que le français rend tous par « prétendument ». Chacun situe
      pourtant l'information autrement, et les confondre coûte cher.

      - `allegedly` : une accusation **non tranchée**, mot du journalisme
        judiciaire ; il protège juridiquement celui qui écrit.
      - `reportedly` : l'information vient d'une source, sans jugement porté.
      - `supposedly` : ce qui est affirmé, mais **que l'auteur met en doute**.
      - `ostensibly` : le motif affiché, par opposition au motif réel.

      La même distance se prend par l'adjectif (`the alleged fraud`) ou par
      `so-called`, qui récuse le mot lui-même.

      ! `supposedly` et `allegedly` ne sont pas interchangeables : le second
      suppose une accusation, le premier une simple prétention.
    points:
      - id: g3-report-1
        sentence: The suspect ___ acted alone, according to police.
        answer: allegedly
        options:
          - allegedly
          - supposedly
          - ostensibly
          - undoubtedly
        translation: Le suspect aurait agi seul, selon la police.
        explanation: "Accusation non établie, dans un cadre judiciaire : « allegedly »."
      - id: g3-report-2
        sentence: ___, the decision was taken without any consultation.
        answer: Reportedly
        options:
          - Reportedly
          - Reported
          - Reporting
          - Report
        translation: Selon certaines sources, la décision a été prise sans aucune consultation.
        explanation: Adverbe de phrase en tête, suivi d'une virgule.
      - id: g3-report-3
        sentence: The building is ___ energy-neutral, though its own figures suggest otherwise.
        answer: supposedly
        options:
          - supposedly
          - allegedly
          - reportedly
          - admittedly
        translation: Le bâtiment est censé être neutre en énergie, même si ses propres chiffres disent le contraire.
        explanation: "La suite marque le doute de l'auteur : « supposedly », là où « allegedly » supposerait une accusation."
      - id: g3-report-4
        sentence: The visit was ___ private, but the press had been informed in advance.
        answer: ostensibly
        options:
          - ostensibly
          - evidently
          - obviously
          - undeniably
        translation: La visite était officiellement privée, mais la presse avait été prévenue à l'avance.
        explanation: « Ostensibly » oppose le motif affiché au motif réel, que la suite dévoile.
      - id: g3-report-5
        sentence: The minister is ___ to have misled parliament.
        answer: alleged
        options:
          - alleged
          - allegedly
          - alleging
          - allege
        translation: Le ministre aurait induit le Parlement en erreur.
        explanation: "Devant un infinitif, c'est le participe qui porte la distance : « is alleged to have », jamais l'adverbe."
      - id: g3-report-6
        sentence: The ___ reforms have changed almost nothing on the ground.
        answer: so-called
        options:
          - so-called
          - self-called
          - such-called
          - said
        translation: Les prétendues réformes n'ont presque rien changé sur le terrain.
        explanation: « So-called » récuse le mot lui-même, et se place directement devant le nom.
