# Cours d'anglais C1 pour francophones : le niveau autonome.
#
# Structure identique au cours B2 (content/courses/fr-en-b2/) : trois pistes
# en accès libre, que l'apprenant parcourt dans l'ordre qu'il veut.
#
# Ce que C1 ajoute au B2 : la précision lexicale et le registre soutenu là
# où B2 se contente d'être correct, l'idiomatique qui ne se traduit pas mot
# à mot, les tournures d'emphase et d'atténuation de l'écrit, et les formes
# verbales rares : subjonctif, irréguliers littéraires, aspects composés.

