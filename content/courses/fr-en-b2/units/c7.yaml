id: c7
title: Le conditionnel
subtitle: Premier, deuxième, troisième et forme mixte
icon: people
color: sky
level: B2.2

lessons:
  - id: c7-l1
    title: Premier et deuxième conditionnel
    notes: |
      Deux structures, pour deux degrés d'irréel — et c'est **la forme du
      verbe dans la proposition en « if »** qui les distingue, pas le sens de
      la phrase entière.

      — 1er conditionnel : `if` + présent, `will` + base verbale. Un futur
        plausible.
        If it rains, I will take the car.
      — 2e conditionnel : `if` + prétérit, `would` + base verbale. Un présent
        ou un futur imaginaire, peu probable ou contraire aux faits.
        If I won the lottery, I would travel the world.

      `would` ne change **jamais** selon le sujet : pas de -s à la troisième
      personne, contrairement au présent français.

      ! Le prétérit dans la proposition en « if » ne parle pas du passé : « if
      I won » ne veut pas dire que j'ai gagné, seulement que c'est improbable.
    verbs:
      - verb: to win
        translation: gagner
        tense: conditionnel
        note: "« will » pour un futur qu'on croit possible, « would » pour un futur qu'on n'y croit pas."
        forms:
          - id: c7-win-first
            person: 1er conditionnel
            answer: will win
          - id: c7-win-second
            person: 2e conditionnel
            answer: would win
      - verb: to know
        translation: savoir
        tense: conditionnel
        note: Le même verbe, deux degrés de probabilité — rien d'autre ne change dans la phrase.
        forms:
          - id: c7-know-first
            person: 1er conditionnel
            answer: will know
          - id: c7-know-second
            person: 2e conditionnel
            answer: would know
      - verb: to help
        translation: aider
        tense: conditionnel
        note: "« would » ne prend jamais de -s, même à la troisième personne."
        forms:
          - id: c7-help-first
            person: 1er conditionnel
            answer: will help
          - id: c7-help-second
            person: 2e conditionnel
            answer: would help

  - id: c7-l2
    title: Conditionnel passé et forme mixte
    notes: |
      Le 3e conditionnel refait le passé ; la forme mixte **répare un passé
      dans le présent**, en combinant les deux structures.

      — 3e conditionnel : `if` + past perfect, `would have` + participe
        passé. Un passé qui ne s'est pas produit.
        If I had known, I would have called you.
      — Conditionnel mixte : hypothèse passée, conséquence présente. `would`
        + base verbale, __pas__ `would have`.
        If I had studied medicine, I would be a doctor now.

      ! Après `would have`, c'est toujours le participe passé : `would have
      been`, jamais « would have be ».
    verbs:
      - verb: to pass
        translation: réussir
        tense: conditionnel
        note: "Le mixte perd le « have » du résultat, même si l'hypothèse reste au passé."
        forms:
          - id: c7-pass-third
            person: 3e conditionnel
            answer: would have passed
          - id: c7-pass-mixed
            person: conditionnel mixte
            answer: would pass
      - verb: to be
        translation: être
        tense: conditionnel
        note: "« been », jamais « be », dès que « would have » apparaît."
        forms:
          - id: c7-be-third
            person: 3e conditionnel
            answer: would have been
          - id: c7-be-mixed
            person: conditionnel mixte
            answer: would be
      - verb: to accept
        translation: accepter
        tense: conditionnel
        note: Même piège dans l'autre sens — ne pas ajouter « have » qui ne sert à rien ici.
        forms:
          - id: c7-accept-third
            person: 3e conditionnel
            answer: would have accepted
          - id: c7-accept-mixed
            person: conditionnel mixte
            answer: would accept
