id: g6
title: Les articles
subtitle: "A, an, the : ce que le français ne calque pas"
icon: clock
color: violet
level: B2.2

lessons:
  - id: g6-l1
    title: A, an, the
    notes: |
      Trois pièges reviennent sans cesse, même à ce niveau : le choix entre
      `a` et `an` **se fait à l'oreille**, pas à l'œil, et `the` s'impose dès
      qu'on parle d'une chose déjà identifiée.

      — `an` devant un **son** de voyelle : `an hour`, mais `a university`
        (qui commence par un son [j]).
      — `a` devant un **son** de consonne, même si la lettre est une voyelle :
        `a one-way street`, `a European country`.
      — `the` reprend ce que la phrase précédente a déjà introduit : la
        deuxième mention devient définie.
        I bought a car last week. The car is red.
      — `the` s'impose devant un superlatif et devant les objets **uniques**
        (`the sun`, `the internet`, `the government` dans son pays).

      ! Le français ne marque pas cette différence de son : « an » ne dépend
      jamais de l'orthographe anglaise, seulement de la prononciation.
    points:
      - id: g6-art-1
        sentence: It's ___ once-in-a-lifetime opportunity.
        answer: a
        options:
          - a
          - an
          - the
          - some
        translation: C'est une occasion unique dans une vie.
        explanation: "« Once » se prononce [wʌns] : le son de consonne impose « a », malgré le « o » écrit."
      - id: g6-art-2
        sentence: She gave ___ honest answer to a difficult question.
        answer: an
        options:
          - an
          - a
          - the
          - some
        translation: Elle a donné une réponse honnête à une question difficile.
        explanation: "Le « h » de « honest » est muet : la voyelle qui suit impose « an »."
      - id: g6-art-3
        sentence: I bought a car last week. ___ car is already making a strange noise.
        answer: The
        options:
          - The
          - A
          - An
          - Some
        translation: J'ai acheté une voiture la semaine dernière. La voiture fait déjà un bruit bizarre.
        explanation: "Seconde mention d'une chose déjà introduite dans la phrase précédente : elle devient définie."
      - id: g6-art-4
        sentence: This is ___ most reliable method we currently have.
        answer: the
        options:
          - the
          - a
          - an
          - some
        translation: C'est la méthode la plus fiable dont nous disposions actuellement.
        explanation: Le superlatif impose systématiquement « the », même sans second terme de comparaison exprimé.
      - id: g6-art-5
        sentence: ___ sun had already set by the time we reached the coast.
        answer: The
        options:
          - The
          - A
          - An
          - Some
        translation: Le soleil s'était déjà couché quand nous avons atteint la côte.
        explanation: Objet unique en son genre — un francophone omet souvent « the » ici, par calque du français.
      - id: g6-art-6
        sentence: I watched ___ interesting documentary about deep-sea creatures last night.
        answer: an
        options:
          - an
          - a
          - the
          - some
        translation: J'ai regardé un documentaire intéressant sur les créatures des abysses hier soir.
        explanation: "Première mention, un élément parmi d'autres : article indéfini, et « an » devant la voyelle de « interesting »."

  - id: g6-l2
    title: The avec les noms propres et les emplois figés
    notes: |
      `the` suit des règles précises devant les noms propres, et certaines
      expressions figées **s'apprennent telles quelles** plutôt que de se
      déduire.

      — Pays au nom pluriel ou composé d'un nom commun : `the Netherlands`,
        `the United States`, `the United Kingdom` — mais rien devant un pays
        au nom simple : `France`, `Japan`.
      — Fleuves, océans, chaînes de montagnes : `the Thames`, `the Atlantic`,
        `the Alps` — mais rien devant un lac ou une montagne isolée :
        `Lake Geneva`, `Everest`.
      — Instruments de musique après `play` : `to play the piano`.
      — `school`, `hospital`, `prison`, `church` **sans article** désignent la
        fonction du lieu ; **avec** `the`, le bâtiment précis.
        She's at school. Elle est en cours (institution).
        She's at the school. Elle est à l'école, ce bâtiment-là.

      ! Cette dernière paire ne se traduit pas : le français dit « à l'école »
      dans les deux cas, l'anglais distingue toujours.
    points:
      - id: g6-proper-1
        sentence: ___ United States signed the treaty in 1987.
        answer: The
        options:
          - The
          - A
          - An
          - Its
        translation: Les États-Unis ont signé le traité en 1987.
        explanation: "Nom de pays pluriel ou composé d'un nom commun (« states ») : il prend toujours « the »."
      - id: g6-proper-2
        sentence: They crossed ___ Atlantic in just under six days.
        answer: the
        options:
          - the
          - a
          - an
          - its
        translation: Ils ont traversé l'Atlantique en un peu moins de six jours.
        explanation: Les océans prennent toujours « the ».
      - id: g6-proper-3
        sentence: This is ___ first time I have seen snow here.
        answer: the
        options:
          - the
          - a
          - an
          - some
        translation: C'est la première fois que je vois de la neige ici.
        explanation: Les ordinaux (« first », « second »…) fonctionnent comme des superlatifs et imposent « the ».
      - id: g6-proper-4
        sentence: He went to ___ school to pick up his daughter.
        answer: the
        options:
          - the
          - a
          - an
          - some
        translation: Il est allé à l'école pour récupérer sa fille.
        explanation: "Il se rend à un bâtiment précis, pas à l'école en tant qu'institution : « the school »."
      - id: g6-proper-5
        sentence: She has been learning to play ___ piano since she was six.
        answer: the
        options:
          - the
          - a
          - an
          - some
        translation: Elle apprend le piano depuis l'âge de six ans.
        explanation: Un instrument de musique après « play » prend toujours « the ».
      - id: g6-proper-6
        sentence: What ___ surprise to see you here!
        answer: a
        options:
          - a
          - an
          - the
          - some
        translation: Quelle surprise de te voir ici !
        explanation: "Exclamation figée « What a + nom » : l'article est indéfini, quel que soit le contexte."
