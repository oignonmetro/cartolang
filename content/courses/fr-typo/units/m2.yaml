id: m2
title: "Institutions et lieux"
subtitle: "La majuscule qui distingue"
icon: people
color: violet

lessons:
  - id: m2-l1
    title: "Organismes et fonctions"
    notes: |
      Un organisme **unique** prend la majuscule à son premier nom, et à lui
      seul : l'adjectif qui suit reste en minuscule. Le mot « ministère » reste en
      minuscule ; c'est le domaine qui prend la majuscule.

      - Organisme unique : majuscule au premier nom.
        l'Assemblée nationale, le Conseil constitutionnel
      - Ministère : minuscule au mot « ministère », majuscule au domaine.
        le ministère de l'Intérieur
      - Premier ministre : majuscule à « Premier », pas à « ministre ».
        Le Premier ministre a démissionné.

      ! La majuscule à chaque mot (« l'Assemblée Nationale ») est un calque de
      l'anglais.
    points:
      - id: m2-assemblee
        sentence: "Le texte a été voté par ___"
        answer: "l'Assemblée nationale."
        options:
          - "l'Assemblée nationale."
          - "l'Assemblée Nationale."
          - "l'assemblée nationale."
        explanation: "Majuscule au premier nom de l'organisme, minuscule à l'adjectif."
      - id: m2-ministere
        sentence: "Il travaille au ___"
        answer: "ministère de l'Intérieur."
        options:
          - "ministère de l'Intérieur."
          - "Ministère de l'Intérieur."
          - "ministère de l'intérieur."
        explanation: "«\u00a0ministère\u00a0» en minuscule, le domaine en majuscule."
      - id: m2-conseil
        sentence: "La loi a été validée par ___"
        answer: "le Conseil constitutionnel."
        options:
          - "le Conseil constitutionnel."
          - "le Conseil Constitutionnel."
          - "le conseil constitutionnel."
        explanation: "Organisme unique\u00a0: seul le premier nom prend la majuscule."
      - id: m2-premier-ministre
        sentence: "___ a démissionné."
        answer: "Le Premier ministre"
        options:
          - "Le Premier ministre"
          - "Le premier ministre"
          - "Le Premier Ministre"
        explanation: "On écrit «\u00a0Premier ministre\u00a0»\u00a0: majuscule au premier mot seulement."
  - id: m2-l2
    title: "Lieux, rues et époques"
    notes: |
      Dans un nom de lieu, le mot **générique** (mer, océan, rue, mont) reste en
      minuscule, et le nom **spécifique** prend la majuscule. Les points cardinaux
      ne prennent la majuscule que lorsqu'ils désignent une région.

      - Mers et océans : générique en minuscule.
        l'océan Atlantique, la mer Méditerranée
      - Rue portant un nom de personne : traits d'union entre les éléments du nom.
        12, rue Victor-Hugo
      - Point cardinal : minuscule pour une direction, majuscule pour une région.
        au nord de Lyon, il a grandi dans le Nord
      - Période historique : majuscule, sans trait d'union.
        le Moyen Âge
    points:
      - id: m2-ocean
        sentence: "Ils ont traversé ___ à la voile."
        answer: "l'océan Atlantique"
        options:
          - "l'océan Atlantique"
          - "l'Océan Atlantique"
          - "l'océan atlantique"
        explanation: "Le générique «\u00a0océan\u00a0» en minuscule, le nom propre en majuscule."
      - id: m2-rue
        sentence: "Il habite au 12, ___"
        answer: "rue Victor-Hugo."
        options:
          - "rue Victor-Hugo."
          - "Rue Victor Hugo."
          - "rue Victor Hugo."
        explanation: "«\u00a0rue\u00a0» en minuscule\u00a0; un nom de personne donné à une voie prend des traits d'union."
      - id: m2-direction
        sentence: "Le village se trouve au ___ de Lyon."
        answer: "nord"
        options:
          - "nord"
          - "Nord"
        explanation: "Une simple direction\u00a0: minuscule."
      - id: m2-region
        sentence: "Il a grandi dans le ___, près de Lille."
        answer: "Nord"
        options:
          - "Nord"
          - "nord"
        explanation: "Le point cardinal désigne une région\u00a0: majuscule."
      - id: m2-moyen-age
        sentence: "Ce château date du ___"
        answer: "Moyen Âge."
        options:
          - "Moyen Âge."
          - "Moyen-Âge."
          - "moyen âge."
        explanation: "«\u00a0Moyen Âge\u00a0»\u00a0: deux majuscules, l'accent maintenu, pas de trait d'union."
