# Cours d'espagnol A2, pour francophones ayant déjà le niveau A1
# (`fr-es-a1`). Construction en cours, même méthode que pour A1 :
# vocabulaire d'abord, grammaire et conjugaison qui n'emploient que du
# vocabulaire déjà vu (`vocabularyScopeRemarks`, tools/content/difficulty.ts).
#   vocabulaire  — v1 travail et études ✓, v2 courses et argent ✓, v3 santé
#                  et corps, v4 voyages et transports, v5 technologie et
#                  communication, v6 loisirs et sport
#   grammaire    — g1 comparatifs et superlatifs, g2 futur proche (ir a +
#                  infinitivo), g3 pronoms compléments (me/te/lo/la…),
#                  g4 por/para, g5 subordonnées avec que
#   conjugaison  — c1 pretérito perfecto (haber + participe, réguliers),
#                  c2 pretérito perfecto (participes irréguliers),
#                  c3 pretérito imperfecto

