id: u7
title: Compter et situer
subtitle: Les premiers nombres et les repères du jour
icon: clock
color: violet
level: A1

lessons:
  - id: u7-l1
    title: De un à six
    vocab:
      - id: ru-odin
        term: один
        translation: un
        pos: nombre
        example:
          text: Один билет, пожалуйста.
          translation: Un billet, s'il vous plaît.
      - id: ru-dva
        term: два
        translation: deux
        pos: nombre
        example:
          text: Два часа.
          translation: Deux heures.
      - id: ru-tri
        term: три
        translation: trois
        pos: nombre
        example:
          text: Три дня.
          translation: Trois jours.
      - id: ru-chetyre
        term: четыре
        translation: quatre
        pos: nombre
        example:
          text: Четыре книги.
          translation: Quatre livres.
      - id: ru-pyat
        term: пять
        translation: cinq
        pos: nombre
        example:
          text: Пять минут.
          translation: Cinq minutes.
      - id: ru-shest
        term: шесть
        translation: six
        pos: nombre
        example:
          text: Шесть часов.
          translation: Six heures.

  - id: u7-l2
    title: Aujourd'hui, demain, ici
    vocab:
      - id: ru-segodnya
        term: сегодня
        translation: aujourd'hui
        pos: adverbe
        hint: "Le Г se lit v dans ce mot : « sivodnia ». Une exception à retenir telle quelle."
        example:
          text: Сегодня хорошо.
          translation: Aujourd'hui, tout va bien.
      - id: ru-zavtra
        term: завтра
        translation: demain
        pos: adverbe
        example:
          text: До завтра!
          translation: À demain !
      - id: ru-seychas
        term: сейчас
        translation: maintenant
        pos: adverbe
        example:
          text: Я сейчас дома.
          translation: Je suis à la maison maintenant.
      - id: ru-zdes
        term: здесь
        translation: ici
        pos: adverbe
        example:
          text: Метро здесь.
          translation: Le métro est ici.
      - id: ru-den
        term: день
        translation: jour
        pos: nom
        example:
          text: Добрый день!
          translation: Bonjour !
      - id: ru-noch
        term: ночь
        translation: nuit
        pos: nom
        example:
          text: Спокойной ночи!
          translation: Bonne nuit !
        gap: ночи

  - id: u7-l3
    title: De sept à cent
    vocab:
      - id: ru-sem
        term: семь
        translation: sept
        pos: nombre
        example:
          text: Семь дней.
          translation: Sept jours.
      - id: ru-vosem
        term: восемь
        translation: huit
        pos: nombre
        example:
          text: Восемь часов.
          translation: Huit heures.
      - id: ru-devyat
        term: девять
        translation: neuf
        pos: nombre
        example:
          text: Девять минут.
          translation: Neuf minutes.
      - id: ru-desyat
        term: десять
        translation: dix
        pos: nombre
        example:
          text: Десять рублей.
          translation: Dix roubles.
      - id: ru-dvadtsat
        term: двадцать
        translation: vingt
        pos: nombre
        hint: "Le groupe ДЦ se prononce comme un seul son « ts »."
        example:
          text: Двадцать лет.
          translation: Vingt ans.
      - id: ru-sto
        term: сто
        translation: cent
        pos: nombre
        example:
          text: Сто рублей.
          translation: Cent roubles.

  - id: u7-l4
    title: Les jours de la semaine
    vocab:
      - id: ru-ponedelnik
        term: понедельник
        translation: lundi
        pos: nom
        example:
          text: Сегодня понедельник.
          translation: Aujourd'hui, c'est lundi.
      - id: ru-vtornik
        term: вторник
        translation: mardi
        pos: nom
        example:
          text: Сегодня вторник.
          translation: Aujourd'hui, c'est mardi.
      - id: ru-sreda
        term: среда
        translation: mercredi
        pos: nom
        example:
          text: Сегодня среда.
          translation: Aujourd'hui, c'est mercredi.
      - id: ru-chetverg
        term: четверг
        translation: jeudi
        pos: nom
        example:
          text: Сегодня четверг.
          translation: Aujourd'hui, c'est jeudi.
      - id: ru-pyatnitsa
        term: пятница
        translation: vendredi
        pos: nom
        example:
          text: Сегодня пятница.
          translation: Aujourd'hui, c'est vendredi.
      - id: ru-subbota
        term: суббота
        translation: samedi
        pos: nom
        example:
          text: Сегодня суббота.
          translation: Aujourd'hui, c'est samedi.
      - id: ru-voskresenye
        term: воскресенье
        translation: dimanche
        pos: nom
        hint: "Le signe mou avant Е garde le son « ïe » distinct, jusqu'au bout du mot."
        example:
          text: Сегодня воскресенье.
          translation: Aujourd'hui, c'est dimanche.
