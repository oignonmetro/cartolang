# Cours de russe grand débutant, pour francophones.
#
# Parti pris central : l'alphabet n'est pas un préalable à franchir avant de
# commencer, il est ce qui ouvre le vocabulaire. Chaque leçon de lettres est
# suivie d'une leçon de mots composés **uniquement de lettres déjà vues** —
# l'apprenant ne rencontre jamais un signe qu'il ne sait pas lire, et déchiffre
# de vrais mots russes dès la première séance.
#
# Les lettres sont groupées par rapport à l'alphabet latin, et non par ordre
# alphabétique : c'est là qu'est la difficulté d'un francophone. Les
# « traîtresses » (В Н Р С У Х), qui ont l'air latines et se lisent autrement,
# forment à elles seules une leçon, parce que le réflexe acquis se bat contre
# la lecture correcte.
#
# D'où le `layout: library`, comme les cours d'anglais : cette progression a
# besoin d'un ordre, mais un ordre *interne*, celui du parcours d'unité. Elle
# tient donc dans une seule unité (u1), qui enseigne l'alphabet en entier avant
# sa dernière leçon.
#
# Les trois unités qui suivent (u6-u8 : se présenter, compter et situer,
# manger et boire) supposent cet alphabet acquis — `alphabetGatingRemarks`
# (tools/content/difficulty.ts) le vérifie sur l'ordre des unités tel qu'il
# est déclaré ci-dessous. Mais la bibliothèque reste en accès libre : rien
# n'empêche techniquement d'ouvrir « Manger et boire » avant « Lire le
# russe ». C'est un compromis assumé, pas un oubli — un enchaînement forcé
# entre unités n'existe nulle part ailleurs dans l'app (les cours d'anglais
# ont le même accès libre), et u1 reste la première unité listée, celle
# qu'on ouvre naturellement en premier.

id: fr-ru-a1
name: Russe
learning: ru
known: fr
flag: 🇷🇺
level: A1
tagline: Lire l'alphabet, puis les premiers mots.
status: available
layout: library
version: 6

# Grammaire et conjugaison n'emploient **que des mots de la piste
# Vocabulaire** — c'est une contrainte tenue, pas une intention : le
# compilateur la vérifie (`vocabularyScopeRemarks`, tools/content/difficulty.ts)
# et signale tout mot qui n'y serait pas enseigné. Un exercice de grammaire ne
# doit jamais buter sur un mot inconnu : la difficulté doit venir de la règle,
# pas du lexique. En retour, chaque phrase de grammaire rebrasse du vocabulaire
# déjà vu, et les deux pistes se renforcent.
tracks:
  - id: vocabulaire
    title: Vocabulaire
    subtitle: Déchiffrer le cyrillique, puis lire de vrais mots
    kind: vocab
    color: teal
    icon: book
    units:
      - u1
      - u6
      - u7
      - u8
      - u9
      - u10
      - u11

  - id: grammaire
    title: Grammaire
    subtitle: Genre, accord, pluriel et localisation
    kind: grammar
    color: violet
    icon: compass
    units:
      - rg1
      - rg2
      - rg3
      - rg4
      - rg5

  - id: conjugaison
    title: Conjugaison
    subtitle: Les deux groupes du présent, et le passé
    kind: conjugation
    color: sky
    icon: clock
    units:
      - rc1
      - rc2
      - rc3
      - rc4
