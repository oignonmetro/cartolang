# Cours de russe grand débutant, pour francophones.
#
# Parti pris central : l'alphabet n'est pas un préalable à franchir avant de
# commencer, il est ce qui ouvre le vocabulaire. Chaque leçon de lettres est
# suivie d'une leçon de mots composés **uniquement de lettres déjà vues** —
# l'apprenant ne rencontre jamais un signe qu'il ne sait pas lire, et déchiffre
# de vrais mots russes dès la première séance.
#
# Les lettres sont groupées par rapport à l'alphabet latin, et non par ordre
# alphabétique : c'est là qu'est la difficulté d'un francophone. Les
# « traîtresses » (В Н Р С У Х), qui ont l'air latines et se lisent autrement,
# forment à elles seules une leçon, parce que le réflexe acquis se bat contre
# la lecture correcte.
#
# D'où le `layout: library`, comme les cours d'anglais : cette progression a
# besoin d'un ordre, mais un ordre *interne*, celui du parcours d'unité. Elle
# tient donc dans une seule unité, et la bibliothèque qui la contient reste en
# accès libre — on ne peut toujours pas lire « спасибо » avant de connaître П,
# С, И et Б, sans imposer pour autant un enchaînement entre unités le jour où
# le cours en comptera plusieurs.
#
# Les trois unités de vocabulaire écrites pour la version « parcours »
# (salutations, nombres, nourriture) attendent dans units-en-reserve/ : elles
# supposent l'alphabet entier acquis, ce que l'accès libre ne garantit plus.
# Voir le README de ce dossier.

