id: g5
title: Prépositions
subtitle: Situer dans le temps et dans l'espace
icon: wave
color: violet
level: B1

lessons:
  - id: g5-l1
    title: Les prépositions de temps
    notes: |
      `in`, `on` et `at` vont du plus large au plus précis — mais à ce niveau la
      difficulté n'est plus là : elle est dans **les couples qui se
      ressemblent**.

      — Un moment de la journée prend `in` (in the morning), sauf **quand un
        jour précis est nommé** : on Monday morning.
      — `by` = au plus tard, une échéance ; `until` = jusqu'à, une durée qui
        se prolonge.
        Finish it by Friday. The shop stays open until midnight.
      — `for` + une durée, `since` + un point de départ, `during` + un nom
        d'événement.
        for ten years, since 2015, during the meeting

      ! `during` ne se met jamais devant une durée chiffrée : on dit
      `for three weeks`, jamais « during three weeks ».
    points:
      - id: g5-time-1
        sentence: The meeting is ___ Monday morning.
        answer: on
        options:
          - on
          - in
          - at
          - during
        translation: La réunion est lundi matin.
        explanation: "« In the morning » seul, mais « on » dès qu'un jour précis est nommé."
      - id: g5-time-2
        sentence: The report has to be on my desk ___ Friday at the latest.
        answer: by
        options:
          - by
          - until
          - for
          - since
        translation: Le rapport doit être sur mon bureau vendredi au plus tard.
        explanation: "« By » pose une échéance ; « until » dirait que cela se prolonge jusque-là."
      - id: g5-time-3
        sentence: The shop stays open ___ midnight on Fridays.
        answer: until
        alt:
          - till
        options:
          - until
          - by
          - at
          - for
        translation: Le magasin reste ouvert jusqu'à minuit le vendredi.
        explanation: "L'ouverture se prolonge : « until », et non « by » qui marquerait une limite à respecter."
      - id: g5-time-4
        sentence: Nobody said a word ___ the entire meeting.
        answer: during
        options:
          - during
          - for
          - while
          - since
        translation: Personne n'a dit un mot pendant toute la réunion.
        explanation: "« During » + nom d'événement ; « while » exigerait une proposition avec un verbe."
      - id: g5-time-5
        sentence: I have known her ___ 2015.
        answer: since
        options:
          - since
          - for
          - during
          - from
        translation: Je la connais depuis 2015.
        explanation: « Since » annonce un point de départ ; « for » compterait une durée.
      - id: g5-time-6
        sentence: They left two hours ___ .
        answer: ago
        options:
          - ago
          - before
          - since
          - early
        translation: Ils sont partis il y a deux heures.
        explanation: « Ago » se place après la durée, en fin de groupe.

  - id: g5-l2
    title: Les prépositions de lieu et de mouvement
    notes: |
      Pour l'espace aussi, `in`, `on` et `at` vont du volume au point. Les
      fautes du niveau tiennent à **trois couples** que le français ne
      distingue pas.

      — `arrive in` + ville ou pays, `arrive at` + lieu précis. Jamais
        « arrive to », calque direct de « arriver à ».
      — On voyage `in` une voiture, mais `on` un bus, un train, un avion —
        tout véhicule où l'on peut se lever.
      — `between` oppose deux éléments identifiés, `among` en noie un dans un
        ensemble.

      ! `to` marque la destination, sauf devant `home` : on dit `go home`,
      sans aucune préposition.
    points:
      - id: g5-place-1
        sentence: We arrived ___ Madrid late at night.
        answer: in
        options:
          - in
          - at
          - to
          - on
        translation: Nous sommes arrivés à Madrid tard dans la nuit.
        explanation: "« Arrive in » devant une ville ; « arrive to » n'existe pas, malgré « arriver à »."
      - id: g5-place-2
        sentence: He is waiting ___ the station, just outside the entrance.
        answer: at
        options:
          - at
          - in
          - on
          - to
        translation: Il attend à la gare, juste devant l'entrée.
        explanation: "« At » voit le lieu comme un point de rendez-vous ; « in the station » dirait à l'intérieur du bâtiment."
      - id: g5-place-3
        sentence: We spent six hours ___ the plane.
        answer: on
        options:
          - on
          - in
          - at
          - into
        translation: Nous avons passé six heures dans l'avion.
        explanation: On voyage « on » un avion, un train ou un bus, mais « in » une voiture.
      - id: g5-place-4
        sentence: We walked ___ the tunnel to reach the beach.
        answer: through
        options:
          - through
          - across
          - over
          - along
        translation: Nous avons traversé le tunnel pour rejoindre la plage.
        explanation: "« Through » traverse un volume ; « across » traverserait une surface."
      - id: g5-place-5
        sentence: The cat jumped ___ the wall.
        answer: over
        options:
          - over
          - through
          - above
          - across
        translation: Le chat a sauté par-dessus le mur.
        explanation: "« Over » franchit par le dessus ; « above » situerait sans mouvement."
      - id: g5-place-6
        sentence: The agreement was signed ___ the two governments.
        answer: between
        options:
          - between
          - among
          - within
          - along
        translation: L'accord a été signé entre les deux gouvernements.
        explanation: "« Between » pour deux parties identifiées ; « among » les fondrait dans un ensemble."
