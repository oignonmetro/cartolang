id: g2
title: Comparer
subtitle: Comparatifs, superlatifs et degrés
icon: people
color: violet
level: B1

lessons:
  - id: g2-l1
    title: Le comparatif
    notes: |
      La règle dépend de la longueur de l'adjectif, pas de son sens.
      — Une syllabe : -er + than. short → shorter than
      — Deux syllabes en -y : le y devient i. happy → happier than
      — Trois syllabes ou plus : more + adjectif + than. interesting → more interesting
      Quelques irréguliers à retenir par cœur : good → better, bad → worse,
      far → further. Les adverbes suivent la même logique : carefully → more carefully.
    points:
      - id: g2-comp-1
        sentence: This road is ___ than the other one. (short)
        answer: shorter
        options:
          - shorter
          - more short
          - shortest
          - the shorter
        translation: Cette route est plus courte que l'autre.
        explanation: "Adjectif d'une syllabe : -er."
      - id: g2-comp-2
        sentence: Your idea is ___ than mine. (interesting)
        answer: more interesting
        options:
          - more interesting
          - interestinger
          - most interesting
          - as interesting
        translation: Ton idée est plus intéressante que la mienne.
        explanation: "Adjectif long : « more » devant, jamais de terminaison -er."
      - id: g2-comp-3
        sentence: He speaks English ___ than I do. (good)
        answer: better
        options:
          - better
          - gooder
          - more good
          - best
        translation: Il parle anglais mieux que moi.
        explanation: "Irrégulier : good / well → better."
      - id: g2-comp-4
        sentence: Today is ___ than yesterday. (hot)
        answer: hotter
        options:
          - hotter
          - hoter
          - more hot
          - hottest
        translation: Il fait plus chaud aujourd'hui qu'hier.
        explanation: Consonne finale redoublée après une voyelle brève accentuée.
      - id: g2-comp-5
        sentence: She drives ___ than her brother. (careful)
        answer: more carefully
        options:
          - more carefully
          - carefuller
          - more careful
          - most carefully
        translation: Elle conduit plus prudemment que son frère.
        explanation: "On compare la manière de conduire : adverbe, donc « more carefully »."
      - id: g2-comp-6
        sentence: The second book is ___ than the first. (bad)
        answer: worse
        options:
          - worse
          - badder
          - more bad
          - worst
        translation: Le deuxième livre est moins bon que le premier.
        explanation: "Irrégulier : bad → worse (et non « worst », qui est le superlatif)."

  - id: g2-l2
    title: Le superlatif et l'égalité
    notes: |
      Le superlatif se construit comme le comparatif, mais avec « the ».
      — the shortest, the most interesting, the best, the worst
      Pour dire l'égalité, on encadre l'adjectif : as + adjectif + as.
      — She is as tall as her mother. / It is not as expensive as I feared.
      « Much », « far » et « a lot » renforcent un comparatif ; « very » ne le
      peut pas : « very better » est faux, « much better » est correct.
    points:
      - id: g2-sup-1
        sentence: It is one of ___ museums in Europe. (big)
        answer: the biggest
        options:
          - the biggest
          - the bigest
          - bigger
          - the most big
        translation: C'est l'un des plus grands musées d'Europe.
        explanation: "Superlatif court : the + adjectif + -est, consonne redoublée."
      - id: g2-sup-2
        sentence: She is by far ___ candidate. (qualified)
        answer: the most qualified
        options:
          - the most qualified
          - the qualifiedest
          - more qualified
          - the more qualified
        translation: Elle est de loin la candidate la plus qualifiée.
        explanation: "Adjectif long : the most + adjectif."
      - id: g2-sup-3
        sentence: That was ___ meal we have had here. (bad)
        answer: the worst
        options:
          - the worst
          - the worse
          - the baddest
          - the most bad
        translation: C'était le pire repas que nous ayons pris ici.
        explanation: "Irrégulier : bad → worse → the worst."
      - id: g2-sup-4
        sentence: She is ___ tall as her mother.
        answer: as
        options:
          - as
          - so
          - than
          - like
        translation: Elle est aussi grande que sa mère.
        explanation: "Égalité : as + adjectif + as."
      - id: g2-sup-5
        sentence: This flat is not ___ expensive as the last one.
        answer: as
        alt:
          - so
        options:
          - as
          - more
          - than
          - such
        translation: Cet appartement n'est pas aussi cher que le précédent.
        explanation: À la forme négative, « so » est possible mais « as » reste le plus courant.
      - id: g2-sup-6
        sentence: This hotel is ___ better than the last one.
        answer: much
        alt:
          - far
          - a lot
        options:
          - much
          - very
          - more
          - too
        translation: Cet hôtel est bien meilleur que le précédent.
        explanation: On renforce un comparatif avec « much » ou « far », jamais « very ».
