id: c5
title: Questions et négations
subtitle: L'auxiliaire do, et les verbes qui s'en passent
icon: book
color: sky
level: B1

lessons:
  - id: c5-l1
    title: Le présent
    notes: |
      Pour poser une question ou nier au présent, l'anglais insère un
      auxiliaire : **`do` porte la personne, et le verbe redevient nu**.

      - Affirmatif : She works here.
      - Interrogatif : Does she work here ? (et non « Does she works »)
      - Négatif : She does not work here.

      Trois familles __échappent à cette règle__ et se retournent toutes seules.

      - `be` : Is she here ? / She is not here.
      - Les modaux : Can she swim ? / She cannot swim.
      - `have got` : Has she got a car ?

      ! Une fois `do` en place, le verbe perd son -s : c'est la faute la plus
      fréquente à ce niveau.
    verbs:
      - verb: to work
        translation: travailler
        tense: présent, avec auxiliaire do
        note: "L'auxiliaire prend le -s, le verbe le perd."
        forms:
          - id: c5-work-q3
            person: interrogatif, il / elle
            answer: does she work
          - id: c5-work-neg3
            person: négatif, il / elle
            answer: does not work
            alt:
              - doesn't work
      - verb: to like
        translation: aimer
        tense: présent, avec auxiliaire do
        note: Aux autres personnes, l'auxiliaire reste « do ».
        forms:
          - id: c5-like-q1
            person: interrogatif, tu / vous
            answer: do you like
          - id: c5-like-neg1
            person: négatif, je / nous / ils
            answer: do not like
            alt:
              - don't like
      - verb: to be
        translation: être
        tense: présent, sans auxiliaire
        note: "« Be » se retourne seul : jamais « does she be »."
        forms:
          - id: c5-be-q3
            person: interrogatif, il / elle
            answer: is she
          - id: c5-be-neg3
            person: négatif, il / elle
            answer: is not
            alt:
              - isn't

  - id: c5-l2
    title: Le passé
    notes: |
      Au passé, la mécanique est identique, mais **c'est `did` qui porte le
      temps**, et le verbe repart à la base verbale, sans marque de passé.

      - Affirmatif : She worked late.
      - Interrogatif : Did she work late ?
      - Négatif : She did not work late.

      Ici encore, `be` et les modaux se passent d'auxiliaire.

      - Was she late ? / She was not late.
      - Could she swim ? / She could not swim.

      ! Après `did`, plus aucune marque de prétérit : on dit `did she work`,
      jamais « did she worked ».
    verbs:
      - verb: to work
        translation: travailler
        tense: prétérit, avec auxiliaire did
        note: "« Did » porte le passé, le verbe revient à la base."
        forms:
          - id: c5-work-qpast
            person: interrogatif
            answer: did she work
          - id: c5-work-negpast
            person: négatif
            answer: did not work
            alt:
              - didn't work
      - verb: to go
        translation: aller
        tense: prétérit, avec auxiliaire did
        note: Même un verbe irrégulier perd sa forme de prétérit après « did ».
        forms:
          - id: c5-go-qpast
            person: interrogatif
            answer: did they go
          - id: c5-go-negpast
            person: négatif
            answer: did not go
      - verb: to be
        translation: être
        tense: prétérit, sans auxiliaire
        note: "« Be » garde son autonomie au passé aussi."
        forms:
          - id: c5-be-qpast
            person: interrogatif, il / elle
            answer: was she
          - id: c5-be-negpast
            person: négatif, il / elle
            answer: was not
            alt:
              - wasn't
