# Cours d'anglais B1 pour francophones : le niveau seuil.
#
# Structure identique au cours B2 (content/courses/fr-en-b2/) : trois pistes
# en accès libre, que l'apprenant parcourt dans l'ordre qu'il veut.
#
# Ce que B1 couvre, et que B2 suppose acquis : le concret et le quotidien
# (déplacements, logement, travail, santé), les temps de base et leurs
# irrégularités, la comparaison, les deux premiers conditionnels et les
# quantifieurs. B2 part de là pour aller vers l'abstrait et l'argumenté.

