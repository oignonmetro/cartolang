    title: Vocabulaire
    subtitle: Sentiments, caractère et relations du quotidien
    kind: vocab
    color: teal
    icon: book
    units:
      - v1

  - id: grammaire
    title: Grammaire
    subtitle: À venir
    kind: grammar
    color: violet
    icon: compass
    units: []

  - id: conjugaison
    title: Conjugaison
    subtitle: Prétérit, present perfect et past perfect
