# Cours d'anglais B1 pour francophones.
#
# Structure identique au cours B2 (content/courses/fr-en-b2/) : trois pistes
# en accès libre. Vocabulaire et conjugaison ont chacun une première unité
# (reprise depuis B2, où son niveau réel était trop bas) ; grammaire est
# encore vide (`units: []`), l'écran y affiche un état « à venir ».
#
# Pour amorcer une piste : créer content/courses/fr-en-b1/units/<id>.yaml,
# puis référencer son id dans la liste `units:` correspondante ci-dessous.
# Voir content/README.md pour le format complet.

id: fr-en-b1
