id: l2
title: "Caractères"
subtitle: "Italique, capitales, gras"
icon: book
color: violet

lessons:
  - id: l2-styles
    title: "Souligner pour changer de style"
    notes: |
      Pour changer le style d'un mot, on le **souligne** : le nombre et la forme des
      traits disent le style voulu, et la marge le confirme en abrégé.

      - Un trait : italique, « ital. ».
      - Deux traits : petites capitales, « p. cap. ».
      - Trois traits : grandes capitales, « gr. cap. ».
      - Trait ondulé : gras, « gras ».
    vocab:
      - id: sig-italique
        term: "mot souligné d’un trait, « ital. » en marge"
        translation: "composer en italique"
        hint: "Un trait sous le mot ; en marge, « ital. »."
        figure: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 280 64\"><path d=\"M204 6 L204 58\" stroke=\"currentColor\" stroke-opacity=\"0.35\" stroke-dasharray=\"3 3\" fill=\"none\"/><g fill=\"currentColor\" font-family=\"Georgia, 'Times New Roman', serif\"><text x=\"15.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">u</text><text x=\"25.6\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">n</text><text x=\"39.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">l</text><text x=\"45.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">i</text><text x=\"53.4\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">v</text><text x=\"62.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">r</text><text x=\"71.0\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">e</text><text x=\"85.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">r</text><text x=\"94.0\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">a</text><text x=\"102.8\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">r</text><text x=\"111.6\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">e</text></g><path d=\"M36.2 44.0 L76.2 44.0\" style=\"stroke:var(--color-coral)\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"214.0\" y=\"40\" font-size=\"17\" font-family=\"Georgia, 'Times New Roman', serif\" style=\"fill:var(--color-coral)\">ital.</text></svg>"
      - id: sig-petites-capitales
        term: "mot souligné de deux traits, « p. cap. » en marge"
        translation: "composer en petites capitales"
        hint: "Deux traits sous le mot ; en marge, « p. cap. »."
        figure: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 280 64\"><path d=\"M204 6 L204 58\" stroke=\"currentColor\" stroke-opacity=\"0.35\" stroke-dasharray=\"3 3\" fill=\"none\"/><g fill=\"currentColor\" font-family=\"Georgia, 'Times New Roman', serif\"><text x=\"15.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">u</text><text x=\"25.6\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">n</text><text x=\"39.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">l</text><text x=\"45.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">i</text><text x=\"53.4\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">v</text><text x=\"62.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">r</text><text x=\"71.0\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">e</text><text x=\"85.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">r</text><text x=\"94.0\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">a</text><text x=\"102.8\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">r</text><text x=\"111.6\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">e</text></g><path d=\"M36.2 44.0 L76.2 44.0\" style=\"stroke:var(--color-coral)\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M36.2 47.5 L76.2 47.5\" style=\"stroke:var(--color-coral)\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"214.0\" y=\"40\" font-size=\"15\" font-family=\"Georgia, 'Times New Roman', serif\" style=\"fill:var(--color-coral)\">p. cap.</text></svg>"
      - id: sig-grandes-capitales
        term: "mot souligné de trois traits, « gr. cap. » en marge"
        translation: "composer en grandes capitales"
        hint: "Trois traits sous le mot ; en marge, « gr. cap. »."
        figure: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 280 64\"><path d=\"M204 6 L204 58\" stroke=\"currentColor\" stroke-opacity=\"0.35\" stroke-dasharray=\"3 3\" fill=\"none\"/><g fill=\"currentColor\" font-family=\"Georgia, 'Times New Roman', serif\"><text x=\"15.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">u</text><text x=\"25.6\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">n</text><text x=\"39.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">l</text><text x=\"45.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">i</text><text x=\"53.4\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">v</text><text x=\"62.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">r</text><text x=\"71.0\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">e</text><text x=\"85.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">r</text><text x=\"94.0\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">a</text><text x=\"102.8\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">r</text><text x=\"111.6\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">e</text></g><path d=\"M36.2 44.0 L76.2 44.0\" style=\"stroke:var(--color-coral)\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M36.2 47.5 L76.2 47.5\" style=\"stroke:var(--color-coral)\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M36.2 51.0 L76.2 51.0\" style=\"stroke:var(--color-coral)\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"214.0\" y=\"40\" font-size=\"15\" font-family=\"Georgia, 'Times New Roman', serif\" style=\"fill:var(--color-coral)\">gr. cap.</text></svg>"
      - id: sig-gras
        term: "mot souligné d’un trait ondulé, « gras » en marge"
        translation: "composer en gras"
        hint: "Un trait ondulé sous le mot ; en marge, « gras »."
        figure: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 280 64\"><path d=\"M204 6 L204 58\" stroke=\"currentColor\" stroke-opacity=\"0.35\" stroke-dasharray=\"3 3\" fill=\"none\"/><g fill=\"currentColor\" font-family=\"Georgia, 'Times New Roman', serif\"><text x=\"15.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">u</text><text x=\"25.6\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">n</text><text x=\"39.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">l</text><text x=\"45.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">i</text><text x=\"53.4\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">v</text><text x=\"62.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">r</text><text x=\"71.0\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">e</text><text x=\"85.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">r</text><text x=\"94.0\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">a</text><text x=\"102.8\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">r</text><text x=\"111.6\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">e</text></g><path d=\"M36.2 46 Q39.2 42 42.2 46 Q45.2 50 48.2 46 Q51.2 42 54.2 46 Q57.2 50 60.2 46 Q63.2 42 66.2 46 Q69.2 50 72.2 46 Q74.2 42 76.2 46\" style=\"stroke:var(--color-coral)\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"214.0\" y=\"40\" font-size=\"17\" font-family=\"Georgia, 'Times New Roman', serif\" style=\"fill:var(--color-coral)\">gras</text></svg>"
  - id: l2-lettres
    title: "Casse et état des lettres"
    notes: |
      D'autres signes portent sur la lettre elle-même : sa casse, sa position, son
      état. La marge dit, là encore, ce qu'il faut faire.

      - Romain : on souligne le mot italique, et « rom. » en marge le redresse.
      - Bas de casse : une capitale barrée, « b.d.c. » en marge, passe en minuscule.
      - Lettre supérieure : en marge, la lettre marquée d'un chevron dessous.
    vocab:
      - id: sig-romain
        term: "mot italique souligné, « rom. » en marge"
        translation: "composer en romain"
        hint: "Le mot à redresser est souligné ; en marge, « rom. ». C’est la marge qui distingue ce signe de l’italique."
        figure: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 280 64\"><path d=\"M204 6 L204 58\" stroke=\"currentColor\" stroke-opacity=\"0.35\" stroke-dasharray=\"3 3\" fill=\"none\"/><g fill=\"currentColor\" font-family=\"Georgia, 'Times New Roman', serif\"><text x=\"15.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\" font-style=\"italic\">u</text><text x=\"25.6\" y=\"40\" font-size=\"20\" text-anchor=\"middle\" font-style=\"italic\">n</text><text x=\"39.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\" font-style=\"italic\">l</text><text x=\"45.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\" font-style=\"italic\">i</text><text x=\"53.4\" y=\"40\" font-size=\"20\" text-anchor=\"middle\" font-style=\"italic\">v</text><text x=\"62.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\" font-style=\"italic\">r</text><text x=\"71.0\" y=\"40\" font-size=\"20\" text-anchor=\"middle\" font-style=\"italic\">e</text><text x=\"85.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\" font-style=\"italic\">r</text><text x=\"94.0\" y=\"40\" font-size=\"20\" text-anchor=\"middle\" font-style=\"italic\">a</text><text x=\"102.8\" y=\"40\" font-size=\"20\" text-anchor=\"middle\" font-style=\"italic\">r</text><text x=\"111.6\" y=\"40\" font-size=\"20\" text-anchor=\"middle\" font-style=\"italic\">e</text></g><path d=\"M36.2 44.0 L76.2 44.0\" style=\"stroke:var(--color-coral)\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"214.0\" y=\"40\" font-size=\"17\" font-family=\"Georgia, 'Times New Roman', serif\" style=\"fill:var(--color-coral)\">rom.</text></svg>"
      - id: sig-bas-de-casse
        term: "capitale barrée, « b.d.c. » en marge"
        translation: "composer en bas de casse"
        hint: "Une barre oblique sur la capitale ; en marge, « b.d.c. » : la lettre passe en minuscule."
        figure: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 280 64\"><path d=\"M204 6 L204 58\" stroke=\"currentColor\" stroke-opacity=\"0.35\" stroke-dasharray=\"3 3\" fill=\"none\"/><g fill=\"currentColor\" font-family=\"Georgia, 'Times New Roman', serif\"><text x=\"13.0\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">l</text><text x=\"21.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">e</text><text x=\"38.6\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">R</text><text x=\"50.6\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">o</text><text x=\"58.8\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">i</text><text x=\"72.4\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">d</text><text x=\"82.8\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">e</text><text x=\"100.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">F</text><text x=\"110.6\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">r</text><text x=\"119.4\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">a</text><text x=\"129.8\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">n</text><text x=\"140.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">c</text><text x=\"150.6\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">e</text></g><path d=\"M33.6 44 L43.6 23\" style=\"stroke:var(--color-coral)\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"214.0\" y=\"40\" font-size=\"15\" font-family=\"Georgia, 'Times New Roman', serif\" style=\"fill:var(--color-coral)\">b.d.c.</text></svg>"
      - id: sig-superieure
        term: "lettres barrées, reprises en marge avec un chevron dessous"
        translation: "composer en lettres supérieures"
        hint: "Une barre sur les lettres à surélever ; en marge, ces lettres, chacune marquée d’un chevron pointé vers le bas."
        figure: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 280 64\"><path d=\"M204 6 L204 58\" stroke=\"currentColor\" stroke-opacity=\"0.35\" stroke-dasharray=\"3 3\" fill=\"none\"/><g fill=\"currentColor\" font-family=\"Georgia, 'Times New Roman', serif\"><text x=\"16.8\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">F</text><text x=\"27.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">r</text><text x=\"36.0\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">a</text><text x=\"46.4\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">n</text><text x=\"56.8\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">ç</text><text x=\"67.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">o</text><text x=\"75.4\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">i</text><text x=\"83.6\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">s</text><text x=\"97.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">I</text><text x=\"105.4\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">e</text><text x=\"114.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">r</text></g><path d=\"M103.4 44 L113.4 23\" style=\"stroke:var(--color-coral)\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"214.0\" y=\"40\" font-size=\"18\" font-family=\"Georgia, 'Times New Roman', serif\" style=\"fill:var(--color-coral)\">e</text><text x=\"228.0\" y=\"40\" font-size=\"18\" font-family=\"Georgia, 'Times New Roman', serif\" style=\"fill:var(--color-coral)\">r</text><path d=\"M214.7 46 L218.7 51 L222.7 46\" style=\"stroke:var(--color-coral)\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M227.2 46 L231.2 51 L235.2 46\" style=\"stroke:var(--color-coral)\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>"
      - id: sig-verifier
        term: "lettre entourée, cercle en marge"
        translation: "vérifier l’état du caractère"
        hint: "Un cercle autour de la lettre abîmée ou douteuse ; en marge, le même cercle, vide."
        figure: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 280 64\"><path d=\"M204 6 L204 58\" stroke=\"currentColor\" stroke-opacity=\"0.35\" stroke-dasharray=\"3 3\" fill=\"none\"/><g fill=\"currentColor\" font-family=\"Georgia, 'Times New Roman', serif\"><text x=\"15.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">u</text><text x=\"25.6\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">n</text><text x=\"36.0\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">e</text><text x=\"51.8\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">p</text><text x=\"60.0\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">i</text><text x=\"68.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">q</text><text x=\"78.6\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">u</text><text x=\"89.0\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">e</text></g><ellipse cx=\"68.2\" cy=\"34.0\" rx=\"9.0\" ry=\"13.0\" style=\"stroke:var(--color-coral)\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><ellipse cx=\"228.0\" cy=\"34.0\" rx=\"13.0\" ry=\"8.0\" style=\"stroke:var(--color-coral)\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>"
