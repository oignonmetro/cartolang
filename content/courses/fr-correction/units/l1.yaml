id: l1
title: "Lettres et mots"
subtitle: "Changer, ajouter, supprimer"
icon: book
color: teal

lessons:
  - id: l1-lettres
    title: "Corriger une lettre"
    notes: |
      Une correction s'écrit **deux fois** : un signe dans le texte, à l'endroit
      fautif, et dans la marge, en face de la ligne, ce qu'il faut faire. Le
      correcteur ne réécrit jamais dans le texte lui-même.

      - Barre oblique : clôt en marge la correction d'une lettre.
      - Renvoi crocheté : marque un manque, dans le texte comme dans la marge.
      - Deleatur : en marge, il ordonne de supprimer.
    vocab:
      - id: sig-changer-lettre
        term: "lettre barrée, bonne lettre en marge suivie d’une barre"
        translation: "changer une lettre"
        hint: "Dans le texte, une barre oblique sur la lettre fautive ; en marge, la bonne lettre, close par une barre."
        figure: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 280 64\"><path d=\"M204 6 L204 58\" stroke=\"currentColor\" stroke-opacity=\"0.35\" stroke-dasharray=\"3 3\" fill=\"none\"/><g fill=\"currentColor\" font-family=\"Georgia, 'Times New Roman', serif\"><text x=\"15.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">u</text><text x=\"25.6\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">n</text><text x=\"36.0\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">e</text><text x=\"54.6\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">m</text><text x=\"67.8\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">a</text><text x=\"76.0\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">i</text><text x=\"84.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">s</text><text x=\"94.6\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">a</text><text x=\"105.0\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">n</text></g><path d=\"M89.6 44 L99.6 23\" style=\"stroke:var(--color-coral)\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"214.0\" y=\"40\" font-size=\"17\" font-family=\"Georgia, 'Times New Roman', serif\" style=\"fill:var(--color-coral)\">o</text><path d=\"M227.0 44 L235.0 23\" style=\"stroke:var(--color-coral)\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>"
      - id: sig-ajouter
        term: "renvoi dans le texte, ajout en marge suivi du renvoi"
        translation: "ajouter une lettre ou un mot"
        hint: "Dans le texte, un renvoi crocheté à l’endroit du manque ; en marge, ce qui manque, suivi du même renvoi."
        figure: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 280 64\"><path d=\"M204 6 L204 58\" stroke=\"currentColor\" stroke-opacity=\"0.35\" stroke-dasharray=\"3 3\" fill=\"none\"/><g fill=\"currentColor\" font-family=\"Georgia, 'Times New Roman', serif\"><text x=\"15.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">u</text><text x=\"25.6\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">n</text><text x=\"41.4\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">c</text><text x=\"51.8\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">h</text><text x=\"62.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">v</text><text x=\"72.6\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">a</text><text x=\"80.8\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">l</text></g><path d=\"M55.0 45 L61.0 25 L66.0 31\" style=\"stroke:var(--color-coral)\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"214.0\" y=\"40\" font-size=\"17\" font-family=\"Georgia, 'Times New Roman', serif\" style=\"fill:var(--color-coral)\">e</text><path d=\"M227.0 45 L233.0 25 L238.0 31\" style=\"stroke:var(--color-coral)\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>"
      - id: sig-supprimer-lettre
        term: "lettre barrée, deleatur en marge suivi d’une barre"
        translation: "supprimer une lettre"
        hint: "Dans le texte, une barre oblique sur la lettre en trop ; en marge, le deleatur, clos par une barre."
        figure: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 280 64\"><path d=\"M204 6 L204 58\" stroke=\"currentColor\" stroke-opacity=\"0.35\" stroke-dasharray=\"3 3\" fill=\"none\"/><g fill=\"currentColor\" font-family=\"Georgia, 'Times New Roman', serif\"><text x=\"15.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">u</text><text x=\"25.6\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">n</text><text x=\"41.4\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">c</text><text x=\"51.8\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">h</text><text x=\"62.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">e</text><text x=\"72.6\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">v</text><text x=\"83.0\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">v</text><text x=\"93.4\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">a</text><text x=\"101.6\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">l</text></g><path d=\"M78.0 44 L88.0 23\" style=\"stroke:var(--color-coral)\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M223.0 31 C218.0 28 214.0 32 214.0 36 C214.0 41 222.0 41 223.0 35 L225.0 24 C226.0 19 218.0 18 218.0 23 C218.0 27 225.0 27 229.0 25\" style=\"stroke:var(--color-coral)\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M230.0 44 L238.0 23\" style=\"stroke:var(--color-coral)\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>"
      - id: sig-intervertir
        term: "trait passant au-dessus puis au-dessous de deux éléments, répété en marge"
        translation: "intervertir deux lettres ou deux mots"
        hint: "Le trait passe au-dessus du premier élément et sous le second ; la marge reprend le même signe."
        figure: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 280 64\"><path d=\"M204 6 L204 58\" stroke=\"currentColor\" stroke-opacity=\"0.35\" stroke-dasharray=\"3 3\" fill=\"none\"/><g fill=\"currentColor\" font-family=\"Georgia, 'Times New Roman', serif\"><text x=\"15.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">d</text><text x=\"25.6\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">u</text><text x=\"39.8\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">f</text><text x=\"47.0\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">r</text><text x=\"55.8\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">o</text><text x=\"69.0\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">m</text><text x=\"82.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">g</text><text x=\"92.6\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">a</text><text x=\"103.0\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">e</text></g><path d=\"M75.0 36 L75.0 21 L87.4 21 L87.4 46 L99.8 46 L99.8 34\" style=\"stroke:var(--color-coral)\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M214.0 36 L214.0 24 L222.0 24 L222.0 42 L230.0 42 L230.0 30\" style=\"stroke:var(--color-coral)\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>"
  - id: l1-mots
    title: "Corriger un mot"
    notes: |
      Pour un mot ou un passage, le signe dans le texte n'est plus une barre
      oblique mais un **trait horizontal** qui le biffe ; en marge, la correction se
      clôt par un trait fermé de deux petites barres.

      - Plusieurs corrections sur une ligne : elles se lisent dans la marge dans l'ordre du texte, de gauche à droite.
      - Correction annulée : des pointillés sous le passage biffé le rétablissent.
    vocab:
      - id: sig-changer-mot
        term: "mot biffé, nouveau mot en marge suivi d’un trait fermé"
        translation: "changer un mot"
        hint: "Dans le texte, un trait horizontal sur le mot ; en marge, le mot nouveau, clos par un trait horizontal fermé de deux barres."
