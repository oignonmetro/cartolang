  - id: l1-mots
    title: "Corriger un mot"
    notes: |
      Pour un mot ou un passage, le signe dans le texte n'est plus une barre
      oblique mais un **trait horizontal** qui le biffe ; en marge, la correction se
      clôt par un trait fermé de deux petites barres.

      - Plusieurs corrections sur une ligne : elles se lisent dans la marge dans l'ordre du texte, de gauche à droite.
      - Interversion : un trait sinueux pour deux lettres, à angles droits pour deux mots.
      - Correction annulée : des pointillés sous le passage biffé le rétablissent, et « bon » le confirme en marge.
    vocab:
      - id: sig-changer-mot
        term: "mot biffé, nouveau mot en marge suivi d’un trait fermé"
        translation: "changer un mot"
        hint: "Dans le texte, un trait horizontal sur le mot ; en marge, le mot nouveau, clos par un trait horizontal fermé de deux barres."
