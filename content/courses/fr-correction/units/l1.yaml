id: l1
title: "Lettres et mots"
subtitle: "Changer, ajouter, supprimer"
icon: book
color: teal

lessons:
  - id: l1-lettres
    title: "Corriger une lettre"
    notes: |
      Une correction s'écrit **deux fois** : un signe dans le texte, à l'endroit
      fautif, et dans la marge, en face de la ligne, ce qu'il faut faire. Le
      correcteur ne réécrit jamais dans le texte lui-même.

      - Barre oblique : clôt en marge la correction d'une lettre.
      - Lambda (λ) : marque un manque, dans le texte comme dans la marge.
      - Deleatur : en marge, il ordonne de supprimer.
    vocab:
      - id: sig-changer-lettre
        term: "lettre barrée, bonne lettre en marge suivie d’une barre"
        translation: "changer une lettre"
        hint: "Dans le texte, une barre oblique sur la lettre fautive ; en marge, la bonne lettre, close par une barre."
