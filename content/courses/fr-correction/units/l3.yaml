      - id: sig-faire-suivre
        term: "trait en S de la fin d’une ligne au début de la suivante, repris en marge"
        translation: "faire suivre le texte"
        hint: "Un trait en S relie la fin d’un paragraphe au début du suivant : on supprime l’alinéa, le texte se suit. La marge reprend le S, clos par une barre."
        figure: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 280 64\"><path d=\"M204 6 L204 58\" stroke=\"currentColor\" stroke-opacity=\"0.35\" stroke-dasharray=\"3 3\" fill=\"none\"/><g fill=\"currentColor\" font-family=\"Georgia, 'Times New Roman', serif\"><text x=\"12.6\" y=\"26\" font-size=\"17\" text-anchor=\"middle\">l</text><text x=\"19.5\" y=\"26\" font-size=\"17\" text-anchor=\"middle\">a</text><text x=\"31.6\" y=\"26\" font-size=\"17\" text-anchor=\"middle\">f</text><text x=\"37.2\" y=\"26\" font-size=\"17\" text-anchor=\"middle\">i</text><text x=\"44.2\" y=\"26\" font-size=\"17\" text-anchor=\"middle\">n</text><text x=\"57.6\" y=\"26\" font-size=\"17\" text-anchor=\"middle\">d</text><text x=\"66.4\" y=\"26\" font-size=\"17\" text-anchor=\"middle\">u</text><text x=\"78.0\" y=\"26\" font-size=\"17\" text-anchor=\"middle\">j</text><text x=\"85.0\" y=\"26\" font-size=\"17\" text-anchor=\"middle\">o</text><text x=\"93.8\" y=\"26\" font-size=\"17\" text-anchor=\"middle\">u</text><text x=\"101.3\" y=\"26\" font-size=\"17\" text-anchor=\"middle\">r</text><text x=\"106.9\" y=\"26\" font-size=\"17\" text-anchor=\"middle\">.</text></g><g fill=\"currentColor\" font-family=\"Georgia, 'Times New Roman', serif\"><text x=\"15.8\" y=\"52\" font-size=\"17\" text-anchor=\"middle\">L</text><text x=\"26.0\" y=\"52\" font-size=\"17\" text-anchor=\"middle\">e</text><text x=\"37.5\" y=\"52\" font-size=\"17\" text-anchor=\"middle\">l</text><text x=\"44.5\" y=\"52\" font-size=\"17\" text-anchor=\"middle\">e</text><text x=\"53.4\" y=\"52\" font-size=\"17\" text-anchor=\"middle\">n</text><text x=\"62.2\" y=\"52\" font-size=\"17\" text-anchor=\"middle\">d</text><text x=\"71.0\" y=\"52\" font-size=\"17\" text-anchor=\"middle\">e</text><text x=\"82.3\" y=\"52\" font-size=\"17\" text-anchor=\"middle\">m</text><text x=\"93.5\" y=\"52\" font-size=\"17\" text-anchor=\"middle\">a</text><text x=\"100.4\" y=\"52\" font-size=\"17\" text-anchor=\"middle\">i</text><text x=\"107.4\" 