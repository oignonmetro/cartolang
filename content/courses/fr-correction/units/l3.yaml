        figure: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 280 64\"><path d=\"M204 6 L204 58\" stroke=\"currentColor\" stroke-opacity=\"0.35\" stroke-dasharray=\"3 3\" fill=\"none\"/><g fill=\"currentColor\" font-family=\"Georgia, 'Times New Roman', serif\"><text x=\"36.8\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">C</text><text x=\"48.8\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">h</text><text x=\"59.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">a</text><text x=\"69.6\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">p</text><text x=\"77.8\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">i</text><text x=\"84.4\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">t</text><text x=\"91.6\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">r</text><text x=\"100.4\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">e</text><text x=\"116.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">p</text><text x=\"125.0\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">r</text><text x=\"133.8\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">e</text><text x=\"147.0\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">m</text><text x=\"158.0\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">i</text><text x=\"166.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">e</text><text x=\"175.0\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">r</text></g><path d=\"M29.0 20 L22.0 20 L22.0 46 L29.0 46\" style=\"stroke:var(--color-coral)\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M179.6 20 L186.6 20 L186.6 46 L179.6 46\" style=\"stroke:var(--color-coral)\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M223.0 20 L216.0 20 L216.0 46 L223.0 46\" style=\"stroke:var(--color-coral)\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M237.0 20 L244.0 20 L244.0 46 L237.0 46\" style=\"stroke:var(--color-coral)\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>"
      - id: sig-deplacer
        term: "passage entouré, flèche vers sa nouvelle place"
        translation: "placer ailleurs"
        hint: "Le passage à déplacer est entouré, et une flèche mène à sa nouvelle place ; en marge, un cercle et une flèche."
        figure: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 280 64\"><path d=\"M204 6 L204 58\" stroke=\"currentColor\" stroke-opacity=\"0.35\" stroke-dasharray=\"3 3\" fill=\"none\"/><g fill=\"currentColor\" font-family=\"Georgia, 'Times New Roman', serif\"><text x=\"15.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">u</text><text x=\"25.6\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">n</text><text x=\"39.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">l</text><text x=\"45.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">i</text><text x=\"53.4\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">v</text><text x=\"62.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">r</text><text x=\"71.0\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">e</text><text x=\"85.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">r</text><text x=\"94.0\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">a</text><text x=\"102.8\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">r</text><text x=\"111.6\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">e</text><text x=\"127.4\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">e</text><text x=\"136.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">t</text></g><ellipse cx=\"56.2\" cy=\"34.0\" rx=\"26.0\" ry=\"13.0\" style=\"stroke:var(--color-coral)\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M56.2 21 C66.2 6 135.8 6 141.8 24 M136.8 20 L141.8 24 L144.8 18\" style=\"stroke:var(--color-coral)\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><ellipse cx=\"224.0\" cy=\"34.0\" rx=\"10.0\" ry=\"7.0\" style=\"stroke:var(--color-coral)\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M234 33 C244 24 252 30 252 40 M248 36 L252 40 L255 35\" style=\"stroke:var(--color-coral)\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>"
