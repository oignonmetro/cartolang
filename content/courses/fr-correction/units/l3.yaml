id: l3
title: "Espaces et mise en page"
subtitle: "Blancs, alinéas, déplacements"
icon: compass
color: coral

lessons:
  - id: l3-espaces
    title: "Les blancs"
    notes: |
      Deux signes de marge règlent les blancs : le **dièse** # ajoute une espace,
      les **deux arcs** qui l'enserrent, l'un dessus, l'autre dessous, la retirent. Associés au deleatur, ils
      disent ce qui remplace le signe supprimé.

      - Deleatur et dièse : supprimer, et mettre une espace à la place.
      - Deleatur et arcs : supprimer, et joindre ce qui reste.
    vocab:
      - id: sig-espace-creer
        term: "trait vertical entre deux mots, dièse en marge"
        translation: "créer ou augmenter une espace"
        hint: "Un trait vertical à l’endroit de l’espace manquante ; en marge, le dièse #."
        figure: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 280 64\"><path d=\"M204 6 L204 58\" stroke=\"currentColor\" stroke-opacity=\"0.35\" stroke-dasharray=\"3 3\" fill=\"none\"/><g fill=\"currentColor\" font-family=\"Georgia, 'Times New Roman', serif\"><text x=\"13.0\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">l</text><text x=\"21.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">e</text><text x=\"34.8\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">j</text><text x=\"43.0\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">o</text><text x=\"53.4\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">u</text><text x=\"62.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">r</text><text x=\"71.0\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">d</text><text x=\"81.4\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">u</text><text x=\"97.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">d</text><text x=\"107.6\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">é</text><text x=\"118.0\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">p</text><text x=\"128.4\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">a</text><text x=\"137.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">r</text><text x=\"144.4\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">t</text></g><path d=\"M86.6 20 L86.6 46\" style=\"stroke:var(--color-coral)\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M218.0 24 L216.0 42 M224.0 24 L222.0 42 M213.0 30 L227.0 30 M212.0 36 L226.0 36\" style=\"stroke:var(--color-coral)\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>"
      - id: sig-espace-supprimer
        term: "arcs au-dessus et au-dessous de l’espace, répétés en marge"
        translation: "supprimer une espace, joindre"
        hint: "Un arc au-dessus et un arc au-dessous de l’espace en trop, qui l’enserrent ; la marge reprend les deux arcs."
        figure: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 280 64\"><path d=\"M204 6 L204 58\" stroke=\"currentColor\" stroke-opacity=\"0.35\" stroke-dasharray=\"3 3\" fill=\"none\"/><g fill=\"currentColor\" font-family=\"Georgia, 'Times New Roman', serif\"><text x=\"13.0\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">l</text><text x=\"21.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">e</text><text x=\"37.0\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">d</text><text x=\"47.4\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">é</text><text x=\"63.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">p</text><text x=\"73.6\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">a</text><text x=\"82.4\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">r</text><text x=\"89.6\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">t</text></g><path d=\"M49.3 20 Q55.3 13 61.3 20 M49.3 44 Q55.3 51 61.3 44\" style=\"stroke:var(--color-coral)\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M214.0 26 Q220.0 19 226.0 26 M214.0 38 Q220.0 45 226.0 38\" style=\"stroke:var(--color-coral)\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>"
      - id: sig-supprimer-espacer
        term: "signe barré, deleatur et dièse en marge"
        translation: "supprimer et espacer"
        hint: "Le signe en trop est barré ; en marge, le deleatur suivi du dièse : on le retire et on met une espace à sa place."
        figure: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 280 64\"><path d=\"M204 6 L204 58\" stroke=\"currentColor\" stroke-opacity=\"0.35\" stroke-dasharray=\"3 3\" fill=\"none\"/><g fill=\"currentColor\" font-family=\"Georgia, 'Times New Roman', serif\"><text x=\"13.0\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">l</text><text x=\"21.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">e</text><text x=\"34.8\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">j</text><text x=\"43.0\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">o</text><text x=\"53.4\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">u</text><text x=\"62.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">r</text><text x=\"71.0\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">-</text><text x=\"81.4\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">d</text><text x=\"91.8\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">e</text><text x=\"106.0\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">f</text><text x=\"114.8\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">ê</text><text x=\"123.6\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">t</text><text x=\"132.4\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">e</text></g><path d=\"M66.0 44 L76.0 23\" style=\"stroke:var(--color-coral)\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M223.0 31 C218.0 28 214.0 32 214.0 36 C214.0 41 222.0 41 223.0 35 L225.0 24 C226.0 19 218.0 18 218.0 23 C218.0 27 225.0 27 229.0 25\" style=\"stroke:var(--color-coral)\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M236.0 24 L234.0 42 M242.0 24 L240.0 42 M231.0 30 L245.0 30 M230.0 36 L244.0 36\" style=\"stroke:var(--color-coral)\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M250.0 44 L258.0 23\" style=\"stroke:var(--color-coral)\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>"
      - id: sig-supprimer-coller
        term: "lettre barrée, deleatur et arcs de jonction en marge"
        translation: "supprimer et joindre"
        hint: "La lettre en trop est barrée ; en marge, le deleatur suivi des deux arcs : on la retire et on referme le mot."
        figure: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 280 64\"><path d=\"M204 6 L204 58\" stroke=\"currentColor\" stroke-opacity=\"0.35\" stroke-dasharray=\"3 3\" fill=\"none\"/><g fill=\"currentColor\" font-family=\"Georgia, 'Times New Roman', serif\"><text x=\"13.0\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">l</text><text x=\"21.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">e</text><text x=\"37.0\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">d</text><text x=\"47.4\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">é</text><text x=\"57.8\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">p</text><text x=\"68.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">a</text><text x=\"78.6\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">a</text><text x=\"87.4\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">r</text><text x=\"94.6\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">t</text></g><path d=\"M63.2 44 L73.2 23\" style=\"stroke:var(--color-coral)\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M223.0 31 C218.0 28 214.0 32 214.0 36 C214.0 41 222.0 41 223.0 35 L225.0 24 C226.0 19 218.0 18 218.0 23 C218.0 27 225.0 27 229.0 25\" style=\"stroke:var(--color-coral)\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M234.0 26 Q240.0 19 246.0 26 M234.0 38 Q240.0 45 246.0 38\" style=\"stroke:var(--color-coral)\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M250.0 44 L258.0 23\" style=\"stroke:var(--color-coral)\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>"
      - id: sig-ligature
        term: "arc reliant deux lettres, ligature encadrée en marge"
        translation: "lier deux lettres"
        hint: "Un arc relie les deux lettres à fondre en ligature ; en marge, la ligature encadrée."
        figure: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 280 64\"><path d=\"M204 6 L204 58\" stroke=\"currentColor\" stroke-opacity=\"0.35\" stroke-dasharray=\"3 3\" fill=\"none\"/><g fill=\"currentColor\" font-family=\"Georgia, 'Times New Roman', serif\"><text x=\"15.2\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">u</text><text x=\"25.6\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">n</text><text x=\"39.8\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">f</text><text x=\"46.4\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">i</text><text x=\"57.8\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">l</text><text x=\"66.0\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">e</text><text x=\"74.8\" y=\"40\" font-size=\"20\" text-anchor=\"middle\">t</text></g><path d=\"M39.8 21 Q43.1 12 46.4 21\" style=\"stroke:var(--color-coral)\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"217.0\" y=\"40\" font-size=\"17\" font-family=\"Georgia, 'Times New Roman', serif\" style=\"fill:var(--color-coral)\">fi</text><path d=\"M215.0 23 L229.2 23 L229.2 45 L215.0 45 Z\" style=\"stroke:var(--color-coral)\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>"
  - id: l3-page
    title: "Alinéas et déplacements"
    notes: |
      Les derniers signes agissent sur la ligne ou le paragraphe entier : ouvrir
      ou supprimer un alinéa, centrer, déplacer un passage.

      - Crochet : ce qu'il enserre est chassé vers son côté ouvert ; ouvert à droite devant un mot, il fait un alinéa.
      - Trait en S : supprime l'alinéa, le texte se suit.
    vocab:
      - id: sig-alinea
        term: "crochet ouvert vers la droite devant le mot, répété en marge"
        translation: "faire un alinéa"
        hint: "Un crochet ouvert vers la droite devant le mot qui doit commencer le paragraphe : ce qu’il enserre est chassé vers son côté ouvert. En marge, le même crochet, clos par une barre."
