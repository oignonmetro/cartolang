# Cours d'espagnol C1, pour francophones ayant le niveau B2.
#
# Contenu calé sur le Plan curricular del Instituto Cervantes (PCIC), colonne
# C1 de l'inventaire de grammaire ; voir docs/recherche-espagnol-c1.md. Le
# C1 n'ajoute presque aucun temps : tout le système verbal est en place au
# B2. Il ajoute des valeurs nouvelles à des formes connues, des nuances de
# mode et des connecteurs de registre soutenu. La piste « Conjugaison »
# enseigne donc des emplois plutôt que des tableaux.
#
# Publié en rappels seuls : les leçons portent leur cours (`notes`), les
# exercices restent à écrire. Pas de piste de vocabulaire pour l'instant.
# Ce qui relève du B1 ou du B2 a été mis de côté dans
# docs/espagnol-b1-b2-en-attente.md.
#
#   grammaire    — g1 concessives, g2 conditions marquées, g3 consécutives
#                  et finales soutenues, g4 relatifs soutenus, g5 le mode qui
#                  change le sens, g6 emphase, g7 temporelles
#   conjugaison  — c1 futur et conditionnel d'objection, c2 imparfait
#                  expressif, c3 subjonctif en phrase indépendante,
#                  c4 périphrases, c5 participe et formes non personnelles,
#                  c6 impératif expressif

