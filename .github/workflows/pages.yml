name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Un commit poussé avec le `GITHUB_TOKEN` d'un autre workflow (ici, celui
  # d'android.yml qui republie `public/app-version.json` sur un tag) ne
  # déclenche pas `push` — restriction anti-boucle de GitHub Actions. Ce
  # second déclencheur comble le trou : il réagit à la fin d'android.yml,
  # quel que soit l'événement qui l'a lancé.
  workflow_run:
    workflows: ["APK Android"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; les pushes suivants attendent leur tour.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # `ref: main` explicite : sur un déclenchement `workflow_run`, le
      # checkout par défaut ne pointe pas forcément sur le dernier commit de
      # main. On veut toujours publier la pointe actuelle de la branche.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Le site est servi depuis https://<compte>.github.io/<dépôt>/ :
      # Vite doit préfixer ses URLs en conséquence.
      - name: Build
        run: npm run build
        env:
          APP_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
