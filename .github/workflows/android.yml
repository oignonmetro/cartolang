name: APK Android

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  apk:
    name: Construire l'APK
    runs-on: ubuntu-latest
    # `contents: write` sert deux étapes ci-dessous : publier la release sur
    # tag, et republier `public/app-version.json` sur `main`.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Le SDK Android est préinstallé sur les runners GitHub ; seul le JDK
      # doit être choisi explicitement.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      # Sur un tag, l'APK embarque le numéro de version du tag : c'est ce que
      # `src/content/appUpdate.ts` compare au contenu de `app-version.json`
      # pour savoir si une mise à jour existe.
      - name: Fixer la version sur le tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          sed -i "s/versionCode .*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName .*/versionName \"${GITHUB_REF_NAME#v}\"/" android/app/build.gradle

      # L'APK sert ses fichiers depuis la racine de la WebView : pas de préfixe.
      - name: Build web puis synchronisation Capacitor
        run: npm run android:sync

      - name: Assembler l'APK de debug
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: cartolang-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Sur un tag, l'APK est aussi publié comme release téléchargeable.
      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk

      # La bannière de mise à jour de l'app (voir `AppUpdateBanner.tsx`) lit ce
      # fichier sur GitHub Pages. On le republie sur `main`, ce qui redéploie
      # les Pages via `pages.yml` — même mécanisme que le contenu des cours.
      - name: Publier la version pour la bannière de mise à jour
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch origin main
          git checkout main
          cat > public/app-version.json <<JSON
          {
            "versionCode": ${{ github.run_number }},
            "versionName": "${GITHUB_REF_NAME#v}",
            "url": "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/app-debug.apk"
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/app-version.json
          git diff --cached --quiet || git commit -m "Publier la version ${GITHUB_REF_NAME#v} pour la bannière de mise à jour de l'APK"
          git push origin main
