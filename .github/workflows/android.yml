name: APK Android

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  apk:
    name: Construire l'APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Le SDK Android est préinstallé sur les runners GitHub ; seul le JDK
      # doit être choisi explicitement.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      # L'APK sert ses fichiers depuis la racine de la WebView : pas de préfixe.
      - name: Build web puis synchronisation Capacitor
        run: npm run android:sync

      - name: Assembler l'APK de debug
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: cartolang-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Sur un tag, l'APK est aussi publié comme release téléchargeable.
      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk
