name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    name: Contenu, types et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Valide les YAML de content/ : identifiants uniques, phrases d'exemple
      # exploitables, leçons assez fournies pour les exercices d'association.
      - name: Valider le contenu des cours
        run: npm run content:check

      - name: Vérifier les types
        run: npm run typecheck

      - name: Tests unitaires
        run: npm test

      - name: Build de production
        run: npm run build
